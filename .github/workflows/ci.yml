name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      # Full history: each page shows when its content last changed, from the last commit touching its file.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # The files no package ships or checks in, fetched by `pnpm assets` from the asset mirror
      # (github.com/cgcostume/himmelszelt-assets), each checked against its SHA-256 in the manifests: ESA's star
      # catalogues, the Milky Way's 8K map, the Moon's 8K maps and the starred map, 90 MB. Kept in Actions' cache until a
      # manifest changes; nothing is built here.
      - uses: actions/cache@v4
        with:
          path: |
            packages/sternenheer/data/hipparcos*.bin.gz
            packages/sternenheer/data/tycho*.bin.gz
            packages/sternenheer/data/milkyway-8k.webp
            site/public/moon/moon-*-8k.webp
            site/public/stars/starmap-cygnus.webp
          key: assets-${{ hashFiles('packages/*/assets.json', 'site/assets.json') }}
      - run: pnpm assets
      # Build first: packages typecheck against each other's dist (e.g. dunstkreis' tests import @himmelszelt/sternzeit).
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      # The browser for the Playwright the packages' tests use, from the workspace: npx at the root, where no package
      # depends on it, resolves whatever it finds or fetches.
      - run: pnpm --filter @himmelszelt/sternzeit exec playwright install --with-deps chromium
      - run: pnpm test
      # The site, built above, becomes the Pages artifact; deployed only from main, once everything passed.
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
